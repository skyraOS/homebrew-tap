name: Verify cask
on:
  push:
    paths: ['Casks/**/*.rb', '.github/workflows/verify.yml']
  pull_request:
    paths: ['Casks/**/*.rb', '.github/workflows/verify.yml']
permissions:
  contents: read
jobs:
  style:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Register checkout as a Homebrew tap and check style
        run: |
          brew tap skyraOS/tap
          TAP="$(brew --repository skyraOS/tap)"
          cp Casks/*.rb "$TAP/Casks/"
          brew style --cask "$TAP/Casks/skyra.rb"
